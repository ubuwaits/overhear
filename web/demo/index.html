<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fragmentary</title>
<link rel="stylesheet" href="style.css">
<main>
  <section class="player" aria-label="Audio effect demonstration">
    <div class="source">
      <audio id="audio" preload="metadata"></audio>
      <div class="transport">
        <button id="play" class="play" type="button" aria-label="Play" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path id="play-shape" d="M8 5v14l11-7z"/></svg></button>
        <div class="timeline"><div class="track"><span title="J. S. Bach — Cello Suite No. 1 in G major, BWV 1007: Prelude">Bach · Cello Prelude</span><span class="time"><span id="elapsed">0:00</span><span class="time-divider"> / </span><span id="duration">0:00</span></span></div><input id="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Playback position" disabled></div>
        <div class="volume"><button id="mute" type="button" aria-label="Mute" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="sound-waves" d="M16 8c2 2 2 6 0 8m3-11c4 4 4 10 0 14" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button><input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume"></div>
      </div>
      <p id="status" role="status">Loading…</p>
    </div>
    <fieldset id="places" disabled aria-label="Filter"><div id="filters"></div></fieldset>
    <div class="presence"><label for="presence">Presence</label><input id="presence" type="range" min="0" max="1" step="0.01" value="1" disabled><output id="amount">100%</output></div>
  </section>
  <footer><a href="https://commons.wikimedia.org/wiki/File:Bach_-_Cello_Suite_no._1_in_G_major,_BWV_1007_-_I._Pr%C3%A9lude,_Lud_and_Schlatts_Musical_Emporium.ogg">Bach: Cello Suite No. 1, Prelude · Philip Milman</a><br>Lud and Schlatt’s Musical Emporium · <a href="https://creativecommons.org/licenses/by/3.0/">CC BY 3.0</a></footer>
</main>
<script type="module" src="demo.js"></script>
</html>
